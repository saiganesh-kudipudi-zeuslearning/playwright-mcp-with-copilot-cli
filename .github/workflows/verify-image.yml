name: Verify Custom Image

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify tools in custom image
        run: |
          docker run --rm ${{ secrets.DOCKER_USERNAME }}/my-playwright-custom:pw1.59.1-v2 bash -c "
            echo '=== Node ===' && node --version &&
            echo '=== NPM ===' && npm --version &&
            echo '=== Playwright ===' && npx --no-install playwright --version &&
            echo '=== GitLab CLI ===' && glab --version &&
            echo '=== Copilot CLI ===' && copilot --version || true
            echo '=== MCP Server Check ===' && npx --no-install playwright run-test-mcp-server --help || echo "MCP server not found ❌"
            echo '=== NODE_PATH ===' && echo \$NODE_PATH &&
            echo '=== @playwright/test exists? ===' && ls \$NODE_PATH/@playwright/test &&
            echo '=== @cucumber/cucumber exists? ===' && ls \$NODE_PATH/@cucumber/cucumber &&
            echo '=== playwright-bdd exists? ===' && ls \$NODE_PATH/playwright-bdd &&
          "