name: Verify Custom Image

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify tools in custom image
        run: |
          docker run --rm ${{ secrets.DOCKER_USERNAME }}/my-playwright-custom:pw1.59.1-v2 bash -c "
            echo '=== Node ===' && node --version &&
            echo '=== NPM ===' && npm --version &&
            echo '=== Glab CLI ===' && glab --version &&
            echo '=== Copilot CLI ===' && copilot --version || true &&
            echo '=== Playwright binary location ===' && find / -name 'playwright' -type f 2>/dev/null
          "